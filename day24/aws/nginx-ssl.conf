# ==============================================================================
# Production Nginx SSL Configuration for NexoraAI Cloud Architecture
# Includes Let's Encrypt TLS 1.3, HTTP/2, HSTS, Reverse Proxy, and SPA Fallback
# ==============================================================================

# 1. HTTP Server - ACME Challenge & Permanent 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.nexora.shop nexora.shop;

    # Let's Encrypt ACME challenge webroot directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP requests to HTTPS with 301 Moved Permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Hardened TLS 1.3, Modern Cipher Suites, and Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nexora.shop nexora.shop;

    # SSL Certificate & Private Key managed by Certbot Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/api.nexora.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nexora.shop/privkey.pem;

    # TLS Protocols & Cipher Suites (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization (Performance)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Speeds up SSL Handshake & Verifies Revocation)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.nexora.shop/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Strict-Transport-Security (HSTS - 2 years with preloading)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # OWASP API Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compiled SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # GZip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Liveness check endpoint for UptimeRobot & Load Balancer
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Proxy backend health & readiness endpoints to FastAPI
    location ~ ^/(health|api/v1/health|metrics) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Priority uploads proxy (product images & invoices)
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy all FastAPI REST API routes
    location ~ ^/(products|auth|cart|orders|tasks|ai|system|docs|openapi.json)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Proxy WebSockets (Real-time live order tracking and customer chat)
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static Vite assets caching
    location ~* ^/assets/.*\.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
