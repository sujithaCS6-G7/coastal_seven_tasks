# Day 23 Free-Tier Cloud Deployment Blueprint (Render + PostgreSQL + Redis + Celery)
services:
  - type: web
    name: nexora-day23-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_ZERO_COST_MODE
        value: "true"
      - key: AI_CACHE_ENABLED
        value: "true"
      - key: AI_CACHE_TTL_SECONDS
        value: "300"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-day23-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexora-day23-redis
          property: connectionString

  - type: worker
    name: nexora-day23-celery-worker
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.email_tasks.celery_app worker --loglevel=info --pool=solo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-day23-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexora-day23-redis
          property: connectionString

  - type: redis
    name: nexora-day23-redis
    plan: free
    ipAllowList: []

databases:
  - name: nexora-day23-postgres
    plan: free
