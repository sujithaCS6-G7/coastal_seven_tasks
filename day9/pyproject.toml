[project]
name = "day9"
version = "0.1.0"
description = "FastAPI Secure File Uploads, WebSockets, Testing & Code Quality"
readme = "README.md"
authors = [
    { name = "sujithaCS6-G7", email = "sujithaCS6-G7@coastalseven.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | uploads
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
