# Day 22 Free-Tier Cloud Deployment Blueprint (Render + Neon PostgreSQL + Upstash Redis)
services:
  - type: web
    name: nexora-day22-ai-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ai/deployment/readiness
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_ZERO_COST_MODE
        value: "true"
      - key: AI_CACHE_ENABLED
        value: "true"
      - key: AI_CACHE_TTL_SECONDS
        value: "300"
      - key: LLM_PRIMARY_PROVIDER
        value: gemini
      - key: LLM_FALLBACK_PROVIDER
        value: groq
      - key: LLM_TERTIARY_PROVIDER
        value: mistral
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-day22-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexora-day22-redis
          property: connectionString

  - type: worker
    name: nexora-day22-celery-ai-worker
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.email_tasks.celery_app worker --loglevel=info --pool=solo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-day22-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexora-day22-redis
          property: connectionString

  - type: redis
    name: nexora-day22-redis
    plan: free
    ipAllowList: []

databases:
  - name: nexora-day22-postgres
    plan: free
