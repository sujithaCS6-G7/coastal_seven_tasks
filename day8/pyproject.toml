[project]
name = "day8"
version = "0.1.0"
description = "Day 8: High-Performance Async Programming, Redis Caching & Celery Tasks"
readme = "README.md"
authors = [
    { name = "sujithaCS6-G7", email = "sujithaCS6-G7@coastalseven.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "flower>=2.2.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
day8 = "day8:start"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
