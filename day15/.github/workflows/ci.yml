name: Day 15 — Frontend TypeScript, Component & E2E CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-quality-and-tests:
    name: TypeScript Check, Vitest + MSW & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11 for FastAPI Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install & Start FastAPI Backend Server
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          python seed.py
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: 4. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 5. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 6. Run TypeScript Static Type Check (tsc --noEmit)
        working-directory: ./frontend
        run: npm run typecheck

      - name: 7. Run Vitest + React Testing Library + MSW Component Tests
        working-directory: ./frontend
        run: npm run test:run

      - name: 8. Build Production TypeScript Bundle
        working-directory: ./frontend
        run: npm run build

      - name: 9. Install Playwright Browsers & Run E2E Suite
        working-directory: ./frontend
        env:
          CI: true
        run: |
          npx playwright install --with-deps chromium
          nohup npm run dev -- --port 5176 &
          sleep 3
          npm run test:e2e
